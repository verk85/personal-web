<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title will be dynamically set by JS -->
    <title>Reading | Jorge Soto</title>
    <link rel="stylesheet" href="css/style.css">

    <!-- Theme setup script must run before body render to prevent flash -->
    <script src="js/theme.js"></script>
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/main.js" defer></script>
</head>
<body>
    <!-- Fixed Neural Network Background — same animation as homepage, sticky on scroll -->
    <canvas id="neural-canvas" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none;"></canvas>

    <header style="position: absolute; top: 0; left: 0; width: 100%; z-index: 1000; background: var(--bg-glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color);">
        <div class="container" style="padding: 1rem 0; display: flex; align-items: center; flex-wrap: wrap;">
            <div class="logo" style="margin-right: auto; font-weight: 700; font-size: 1.5rem; letter-spacing: -0.05em;">
                <a href="index.html" style="color: inherit; text-decoration: none;">JORGE SOTO</a>
            </div>
            <nav>
                <ul style="display: flex; gap: 2rem; list-style: none;">
                    <li><a href="index.html#philosophy">Philosophy</a></li>
                    <li><a href="index.html#work">Work</a></li>
                    <li><a href="blog.html">Blog</a></li>
                </ul>
            </nav>

            <button id="theme-toggle-btn" class="theme-toggle" onclick="window.toggleTheme()" type="button" title="Toggle theme" aria-label="Toggle theme" style="display: flex; align-items: center; justify-content: center; margin-left: 2rem;">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="1.5em" height="1.5em" fill="currentColor" stroke-linecap="round" class="theme-toggle__classic" viewBox="0 0 32 32">
                    <clipPath id="theme-toggle__classic__cutout">
                        <path d="M0-5h30a1 1 0 0 0 9 13v24H0Z" />
                    </clipPath>
                    <g clip-path="url(#theme-toggle__classic__cutout)">
                        <circle cx="16" cy="16" r="9.34" />
                        <g stroke="currentColor" stroke-width="1.5">
                            <path d="M16 5.5v-4" />
                            <path d="M16 30.5v-4" />
                            <path d="M1.5 16h4" />
                            <path d="M26.5 16h4" />
                            <path d="m23.4 8.6 2.8-2.8" />
                            <path d="m5.7 26.3 2.9-2.9" />
                            <path d="m5.8 5.8 2.8 2.8" />
                            <path d="m23.4 23.4 2.9 2.9" />
                        </g>
                    </g>
                </svg>
            </button>
        </div>
    </header>

    <main style="position: relative; z-index: 1;">
        <section class="section container" style="padding-top: 120px; padding-bottom: 6rem; max-width: 860px; margin: 0 auto; min-height: 70vh;">
            <a href="blog.html" style="display: inline-block; margin-bottom: 2rem; color: var(--text-muted); text-decoration: none; font-weight: 600; transition: color 0.2s ease;">
                &larr; Back to Blog
            </a>

            <!-- Post card — mirrors project-card-template framing -->
            <article id="single-post-container" style="background: var(--bg-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 2.5rem; border-radius: 12px; border: 1px solid var(--border-color);">
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1.25rem;">
                    <span id="post-category" style="color: var(--accent-main); font-size: 0.9rem; font-weight: 600;"></span>
                    <span id="post-date" style="color: var(--text-muted); font-size: 0.9rem;"></span>
                </div>
                <h1 id="post-title" style="font-size: 3rem; margin: 0 0 2rem; line-height: 1.2;"></h1>
                <div id="post-content" style="color: var(--text-secondary); line-height: 1.8; font-size: 1.1rem;">
                    <!-- Full Content renders here -->
                </div>
            </article>

            <!-- Error State if ID is wrong -->
            <div id="post-error" style="display: none; text-align: center; padding: 4rem 0;">
                <h2>Post Not Found.</h2>
                <p>The neural pathways to this thought seem to be disconnected.</p>
            </div>
        </section>
    </main>

    <footer style="position: relative; z-index: 1; background: var(--bg-glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: 3rem 0; border-top: 1px solid var(--border-color);">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div style="color: var(--text-secondary);">
                &copy; 2024 Jorge Soto. Built with intention.
            </div>
            <div style="display: flex; gap: 1.5rem;">
                <a href="https://www.linkedin.com/in/jorgesoto85/" style="color: var(--text-muted);">LinkedIn</a>
            </div>
        </div>
    </footer>

    <script src="js/neural-bg.js"></script>
</body>
</html>
